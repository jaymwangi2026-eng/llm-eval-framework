[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval"
version = "0.1.0"
description = "Validated schemas, weighted scoring and reports for LLM evaluations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "James Mwangi" }]
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "pandas>=2.0",
    "tabulate>=0.9",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.29", "ruff>=0.4"]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
